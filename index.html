<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validación Albaranes Expediciones</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:12px;text-align:center;color:#1f2937}
.card{max-width:850px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
.header{background:#ffffff;color:#111111;border-bottom:3px solid #0f766e;padding:8px 12px 14px 12px;margin-bottom:15px;display:flex;flex-direction:column;align-items:center}
.telstar-svg{height:38px;width:auto;display:block;margin-bottom:8px}
.header h1{margin:0;font-size:24px;color:#0f766e}.header p{margin:4px 0 0 0;color:#4b5563}
#reader{max-width:500px;margin:auto;overflow:hidden;border-radius:15px}
.inputbox{background:#f8fafc;border:2px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}
.label{font-weight:bold;color:#0f766e}
input{width:95%;padding:10px;border:none;background:transparent;text-align:center;font-size:18px}
button{padding:14px 20px;border:none;border-radius:10px;background:#0f766e;color:white;font-size:18px;margin:6px;cursor:pointer}
#paso{font-size:20px;font-weight:bold;padding:10px}
.okfull,.kofull{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:white}
.okfull{background:#16a34a}.kofull{background:#dc2626}
.big{font-size:110px}.msg{font-size:42px;font-weight:bold}.sub{font-size:24px;margin-top:10px}
.accordion-toggle{width:100%;background:#f4f7fb;border:2px solid #d5e0ec;border-radius:14px;padding:15px;margin:14px 0 0 0;display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;color:#0f766e;cursor:pointer;box-sizing:border-box}
.accordion-content{display:none;margin-top:12px;text-align:left}
.accordion-content.open{display:block}
.filter-bar{display:flex;align-items:center;gap:8px;background:#f8fafc;border:2px solid #e5e7eb;border-radius:12px;padding:10px 12px;margin-bottom:12px}
.filter-bar label{font-size:15px;font-weight:bold;color:#0f766e;white-space:nowrap}
.filter-select{flex:1;padding:9px 10px;border-radius:8px;border:1px solid #cbd5e1;background:#ffffff;font-size:15px;font-weight:bold;color:#1f2937}
.day-group{border:1px solid #d5e0ec;border-radius:14px;margin-bottom:10px;overflow:hidden;background:#ffffff}
.day-toggle{width:100%;background:#f0fdfa;border:none;margin:0;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:800;color:#0f766e;cursor:pointer;text-align:left;box-sizing:border-box}
.day-badge{background:#0f766e;color:#ffffff;border-radius:12px;padding:2px 9px;font-size:12px;margin-left:8px}
.day-content{display:none;padding:10px 12px;background:#ffffff}
.day-content.open{display:block}
.item{border-bottom:1px solid #ddd;padding:8px;font-size:14px}.item:last-child{border-bottom:none}.item img{max-width:85px;border-radius:8px;margin-top:5px}
.oktag{color:#16a34a;font-weight:bold}.errtag{color:#dc2626;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="header">
  <svg class="telstar-svg" viewBox="0 0 360 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telstar - A Syntegon Company">
    <text x="72" y="54" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="60" letter-spacing="-1.5">Telstar</text>
    <rect x="277" y="42" width="12" height="12" fill="none" stroke="#000000" stroke-width="3.5"/>
    <text x="108" y="80" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14.5" letter-spacing="0.6">A SYNTEGON COMPANY</text>
  </svg>
  <h1>📦 Validación Albaranes Expediciones</h1>
  <p>Comparación automática de códigos</p>
</div>
<div id="paso">Pulse INICIAR CÁMARA</div>
<div id="reader"></div>
<div class="inputbox"><div class="label">📄 Lectura 1</div><input id="c1" readonly></div>
<div class="inputbox"><div class="label">📦 Lectura 2</div><input id="c2" readonly></div>
<button onclick="iniciarCamara()">📷 Iniciar cámara</button>
<button type="button" id="btnHistorial" class="accordion-toggle" onclick="toggleHistorial()">
  <span>📋 Historial últimos 6 meses (<span id="totalHistorial">0</span>)</span>
  <span id="flechaHistorial">▼</span>
</button>
<div id="historialPanel" class="accordion-content">
  <div class="filter-bar">
    <label for="filtroDia">📅 Filtrar día:</label>
    <select id="filtroDia" class="filter-select" onchange="cambiarFiltroDia()">
      <option value="TODOS">Todos los días</option>
    </select>
  </div>
  <div id="historial"></div>
</div>
</div>
<script>
let qrScanner=null,codigo1='',codigo2='',bloqueo=false,ultimoFrame='',diaSeleccionado='TODOS',historialAbierto=false,diasAbiertos={};const DIAS=180;
function obtenerClaveDia(item){if(item&&item.fechaISO){let d=new Date(item.fechaISO);if(!isNaN(d.getTime()))return d.toLocaleDateString('es-ES');}if(item&&item.fecha){let partes=String(item.fecha).split(',')[0].trim();if(partes)return partes;}return 'Sin fecha';}
function toggleHistorial(){historialAbierto=!historialAbierto;document.getElementById('historialPanel').className=historialAbierto?'accordion-content open':'accordion-content';document.getElementById('flechaHistorial').textContent=historialAbierto?'▲':'▼';}
function toggleDia(fecha){diasAbiertos[fecha]=!diasAbiertos[fecha];cargarHist();}
function cambiarFiltroDia(){diaSeleccionado=document.getElementById('filtroDia').value;if(diaSeleccionado!=='TODOS'){diasAbiertos[diaSeleccionado]=true;}cargarHist();}
function renderItemHtml(x){return `<div class=item><b>${x.fecha}</b> <span class='${x.resultado==='OK'?'oktag':'errtag'}'>${x.resultado}</span><br>${x.c1}<br>${x.c2}<br><img src='${x.img}'></div>`;}
function cargarHist(){let h=JSON.parse(localStorage.getItem('historialV52')||'[]');let lim=Date.now()-DIAS*24*60*60*1000;h=h.filter(x=>new Date(x.fechaISO).getTime()>lim);localStorage.setItem('historialV52',JSON.stringify(h));document.getElementById('totalHistorial').textContent=h.length;let hoy=new Date().toLocaleDateString('es-ES');let grupos={};let ordenDias=[];for(let i=0;i<h.length;i++){let dia=obtenerClaveDia(h[i]);if(!grupos[dia]){grupos[dia]=[];ordenDias.push(dia);}grupos[dia].push(h[i]);}let sel=document.getElementById('filtroDia');let previo=diaSeleccionado;sel.innerHTML='<option value="TODOS">Todos los días ('+h.length+')</option>';for(let j=0;j<ordenDias.length;j++){let fDia=ordenDias[j];let opt=document.createElement('option');opt.value=fDia;opt.textContent=(fDia===hoy?'Hoy · '+fDia:fDia)+' ('+grupos[fDia].length+')';sel.appendChild(opt);}if(previo!=='TODOS'&&!grupos[previo]){diaSeleccionado='TODOS';}sel.value=diaSeleccionado;let cont=document.getElementById('historial');if(!h.length){cont.innerHTML='<div style="text-align:center;padding:14px;color:#6b7280;">No hay registros en los últimos 6 meses.</div>';return;}let html='';for(let k=0;k<ordenDias.length;k++){let fDia=ordenDias[k];if(diaSeleccionado!=='TODOS'&&diaSeleccionado!==fDia)continue;let lista=grupos[fDia];let abierto=!!diasAbiertos[fDia];let tituloDia=(fDia===hoy)?`📅 Hoy (${fDia})`:`📅 ${fDia}`;html+=`<div class="day-group"><button type="button" class="day-toggle" onclick="toggleDia('${fDia.replace(/'/g,"\\'")}')"><span>${tituloDia}<span class="day-badge">${lista.length}</span></span><span>${abierto?'▲':'▼'}</span></button><div class="day-content ${abierto?'open':''}">${lista.map(renderItemHtml).join('')}</div></div>`;}cont.innerHTML=html;}
function guardar(r){let h=JSON.parse(localStorage.getItem('historialV52')||'[]');let ahora=new Date();h.unshift({fecha:ahora.toLocaleString(),fechaISO:ahora.toISOString(),resultado:r,c1:codigo1,c2:codigo2,img:ultimoFrame});localStorage.setItem('historialV52',JSON.stringify(h));diasAbiertos[ahora.toLocaleDateString('es-ES')]=true;cargarHist();}
function beep(f,d){const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;o.start();o.stop(c.currentTime+d/1000);}
async function cerrarCamara(){if(qrScanner){try{await qrScanner.stop();}catch(e){}try{await qrScanner.clear();}catch(e){}qrScanner=null;}}
function limpiarCampos(){codigo1='';codigo2='';ultimoFrame='';c1.value='';c2.value='';paso.innerHTML='📷 Pulse INICIAR CÁMARA';}
async function mostrar(ok){let d=document.createElement('div');d.className=ok?'okfull':'kofull';d.innerHTML=ok?`<div class='big'>✅</div><div class='msg'>ALBARÁN VALIDADO</div><div class='sub'>${codigo1}</div>`:`<div class='big'>❌</div><div class='msg'>ERROR DE VALIDACIÓN</div><div class='sub'>${codigo1} ≠ ${codigo2}</div>`;document.body.appendChild(d);guardar(ok?'OK':'ERROR');if(ok){beep(950,200);}else{beep(250,500);}await cerrarCamara();setTimeout(()=>{d.remove();limpiarCampos();},3000);}
function procesar(t){if(bloqueo)return;bloqueo=true;if(!codigo1){codigo1=t;c1.value=t;paso.innerHTML='✅ Primera lectura correcta. Escanee la segunda.';}else if(!codigo2){codigo2=t;c2.value=t;mostrar(codigo1===codigo2);}setTimeout(()=>bloqueo=false,1200);}
function iniciarCamara(){if(qrScanner)return;codigo1='';codigo2='';c1.value='';c2.value='';paso.innerHTML='📷 Escanee la primera etiqueta';qrScanner=new Html5Qrcode('reader');qrScanner.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{try{let v=document.querySelector('video');if(v){let c=document.createElement('canvas');c.width=v.videoWidth||320;c.height=v.videoHeight||240;c.getContext('2d').drawImage(v,0,0,c.width,c.height);ultimoFrame=c.toDataURL('image/jpeg',0.5);}}catch(e){}procesar(txt);}).catch(()=>{qrScanner=null;alert('No se pudo abrir la cámara');});}
window.onload=cargarHist;
</script>
</body>
</html>
